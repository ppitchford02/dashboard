name: Rebuild and publish dashboard

on:
  schedule:
    - cron: "7,22,37,52 * * * *" # includes the first build after 06:00 Akron time
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Restore previous news edition
        uses: actions/cache/restore@v4
        with:
          path: news.json
          key: morning-news-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            morning-news-${{ github.ref_name }}-
            morning-news-main-
      - name: Regression checks
        run: |
          python3 -m unittest discover -s tests
          node --test tests/*.test.mjs
      - name: Build dashboard
        run: python3 build.py
      - name: Save news edition
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: news.json
          key: morning-news-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Prepare public files
        run: |
          mkdir -p public
          cp index.html data.json news.json public/
      - name: Upload for Pages
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
