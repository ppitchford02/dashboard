name: Rebuild and publish dashboard

on:
  schedule:
    - cron: "*/15 * * * *"    # every 15 min; GitHub queues these so expect drift
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build index.html
        run: python3 build.py

      - name: Commit if changed
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name  "dashboard bot"
            git config user.email "actions@github.com"
            git add index.html
            git commit -m "Rebuild $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          else
            echo "index.html unchanged"
          fi

      - name: Upload for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
